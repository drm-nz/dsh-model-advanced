name: check

# No automated behaviour tests: the plugin decorates a live LLM runtime that is not
# practical to fake. This only guards against a file that no longer parses.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Parse host and browser halves
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Manifest declares a bundle patch
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch')"
